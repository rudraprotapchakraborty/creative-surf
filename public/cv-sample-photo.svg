<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustrated portrait for the sample CV">
  <!-- An illustration, not a photograph: the sample CV's candidate is fictional,
       so her portrait is drawn rather than borrowed from a real person. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FA"/>
      <stop offset="1" stop-color="#CFE3F2"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16365C"/>
      <stop offset="1" stop-color="#0D2440"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1B16"/>
      <stop offset="1" stop-color="#1A100D"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- A soft swell behind the shoulders, the brand's wave. -->
  <path d="M0 430 C120 395 210 455 330 425 C450 395 520 430 600 410 L600 600 L0 600 Z" fill="#B7D6EC" opacity="0.7"/>

  <!-- Hair, back layer -->
  <path d="M168 300 C150 200 205 118 300 116 C398 114 452 196 436 300 C430 360 452 420 470 470 L130 470 C150 420 172 360 168 300 Z" fill="url(#hair)"/>

  <!-- Shoulders and blazer -->
  <path d="M86 600 C92 520 150 470 232 452 L368 452 C450 470 508 520 514 600 Z" fill="url(#blazer)"/>
  <!-- Blouse -->
  <path d="M252 452 L348 452 L326 560 L274 560 Z" fill="#F4F7FB"/>
  <!-- Lapels -->
  <path d="M232 452 L274 560 L240 600 L200 600 L214 470 Z" fill="#1E4776"/>
  <path d="M368 452 L326 560 L360 600 L400 600 L386 470 Z" fill="#1E4776"/>

  <!-- Neck -->
  <path d="M266 372 L334 372 L338 452 C318 470 282 470 262 452 Z" fill="#B97A55"/>
  <path d="M266 400 C288 414 312 414 334 400 L334 372 L266 372 Z" fill="#A86A47" opacity="0.6"/>

  <!-- Face -->
  <ellipse cx="300" cy="292" rx="88" ry="104" fill="#C98D63"/>
  <!-- Ear and earring -->
  <ellipse cx="213" cy="298" rx="13" ry="22" fill="#BC8059"/>
  <circle cx="213" cy="326" r="6" fill="#E9C46A"/>

  <!-- Hair, front: a side part sweeping across -->
  <path d="M204 300 C200 196 256 150 318 152 C374 154 408 194 400 246 C362 218 304 216 262 240 C236 255 216 276 204 300 Z" fill="url(#hair)"/>
  <path d="M398 238 C410 270 404 320 392 352 C392 300 386 262 372 236 Z" fill="url(#hair)"/>

</svg>
